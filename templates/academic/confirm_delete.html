{% extends 'base.html' %}
{% block title %}Confirm Delete - Brainora{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-5 text-center">
                <i class="fas fa-exclamation-triangle text-warning mb-3" style="font-size: 50px;"></i>
                <h3 class="text-danger mb-3">Delete Resource?</h3>
                <p class="text-secondary mb-4">Are you sure you want to delete "<strong>{{ resource.title }}</strong>"? This action cannot be undone.</p>
                <form method="POST" class="d-flex gap-3 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-5">Delete</button>
                    <a href="{% url 'academic:resource_detail' resource.id %}" class="btn btn-secondary px-5">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
